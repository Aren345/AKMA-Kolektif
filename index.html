<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKMA Kolektif - Sipariş & Eleman Ağı</title>
  
  <!-- React & ReactDOM (Canlı CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (JSX derleyicisi) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS (Canlı Tasarım CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Kararlı Firebase Compat SDK'ları (Çökmeyi Önleyen Küresel Kütüphaneler) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    html, body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <!-- React ve Uygulama Mantığı -->
  <script type="text/babel">
    
    // --- BURAYA KENDİ FIREBASE ANAHTARLARINI YAPIŞTIRABİLİRSİN ---
    // Eğer yapıştırmazsan sistem otomatik olarak "Canlı Yerel Simülasyon" modunda çalışır ve asla çökmez!
    const firebaseConfig = {
      apiKey: "mock-api-key",
      authDomain: "mock-auth-domain",
      projectId: "mock-project",
      storageBucket: "mock-storage",
      messagingSenderId: "mock-sender",
      appId: "mock-app"
    };

    let db = null;
    let auth = null;
    let isDemoMode = true;

    // Firebase'i kararlı şekilde başlatma denemesi
    try {
      if (window.firebase && firebaseConfig.apiKey !== "mock-api-key") {
        window.firebase.initializeApp(firebaseConfig);
        db = window.firebase.firestore();
        auth = window.firebase.auth();
        isDemoMode = false;
        console.log("🔥 Firebase Bulut Veritabanı başarıyla bağlandı!");
      } else {
        console.warn("⚠️ Firebase anahtarları bulunamadı. Yerel Simülasyon moduna geçiliyor.");
      }
    } catch (e) {
      console.error("Firebase başlatılamadı, Yerel Simülasyona geçiliyor:", e);
      isDemoMode = true;
    }

    // --- REAKTİF VERİ SEÇENEKLERİ ---
    const COLOR_OPTIONS = [
      { id: 'siyah', name: 'Siyah', hex: '#000000' },
      { id: 'beyaz', name: 'Beyaz', hex: '#FFFFFF' },
      { id: 'kirmizi', name: 'Kırmızı', hex: '#EF4444' },
      { id: 'mavi', name: 'Mavi', hex: '#3B82F6' },
      { id: 'yesil', name: 'Yeşil', hex: '#10B981' },
      { id: 'sari', name: 'Sarı', hex: '#FBBF24' },
      { id: 'turuncu', name: 'Turuncu', hex: '#F97316' },
      { id: 'mor', name: 'Mor', hex: '#A855F7' },
      { id: 'pembe', name: 'Pembe', hex: '#EC4899' },
      { id: 'turkuaz', name: 'Turkuaz', hex: '#06B6D4' },
      { id: 'lacivert', name: 'Lacivert', hex: '#1E3A8A' }
    ];

    const AVATAR_OPTIONS = ["🦁", "🐼", "🦊", "🐯", "🐱", "🐨", "🐸", "🐵", "👑", "🚀", "⚡", "👾"];

    const { useState, useEffect } = React;

    // --- ÖZEL İKONLAR (Sıfır Hata İçin Saf SVG) ---
    const Icons = {
      Wifi: () => (
        <svg className="w-3.5 h-3.5 text-green-400 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12.5a13.38 13.38 0 0 1 14 0" /><path d="M8.5 16.29a8.34 8.34 0 0 1 7 0" /><path d="M12 20h.01" />
        </svg>
      ),
      WifiOff: () => (
        <svg className="w-3.5 h-3.5 text-yellow-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84" /><path d="M12 20h.01" />
        </svg>
      ),
      ShoppingBag: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      ),
      Scissors: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="9.8" y1="8.2" x2="21" y2="19.4" /><line x1="21" y1="4.6" x2="14.5" y2="11" /><line x1="11" y1="14.5" x2="8.2" y2="17.3" />
        </svg>
      ),
      Trash2: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
        </svg>
      ),
      MapPin: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />
        </svg>
      ),
      Send: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      ),
      Check: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
      Plus: ({ className = "" }) => (
        <svg className={`${className} w-4 h-4`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      )
    };

    // --- STREAMING_CHUNK: React Component Başlangıcı... ---
    const App = () => {
      const [role, setRole] = useState('customer'); // 'customer', 'staff', 'patron'
      const [activeTab, setActiveTab] = useState('catalog'); // 'catalog', 'cart', 'tracking', 'profile'
      const [patronTab, setPatronTab] = useState('orders'); // 'orders', 'staff', 'resources'
      const [cart, setCart] = useState([]);
      const [showToast, setShowToast] = useState(false);
      const [copied, setCopied] = useState(false);

      // Şifre Giriş Kontrolleri (1089)
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      
      // Eleman Giriş State'leri
      const [activeStaff, setActiveStaff] = useState(null); 
      const [staffNameInput, setStaffNameInput] = useState("");
      const [staffRoleInput, setStaffRoleInput] = useState("örüsü");

      // Müşteri Profil State
      const [profile, setProfile] = useState({
        name: '',
        classRoom: '', 
        deskRow: 'Orta Sıra',
        avatar: '🦁',
        isRegistered: false
      });

      // Bileklik Özelleştirme State
      const [customOptions, setCustomOptions] = useState({
        size: 'M (Standart)',
        envelope: 'Standart Şeffaf',
        selectedColors: [], 
        customColorText: '', 
        note: ''
      });

      // Canlı Veri Listeleri
      const [orders, setOrders] = useState([]);
      const [staffList, setStaffList] = useState([]);
      const [staffRequests, setStaffRequests] = useState([]);

      const [materials, setMaterials] = useState(500); 
      const [money, setMoney] = useState(1500); 

      // --- SENTETİK BİLDİRİM SESİ ---
      const playNotificationSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12); 
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {
          console.log("Ses çalma engellendi.");
        }
      };

      // --- STREAMING_CHUNK: LocalStorage ve Firebase Veri Entegrasyonu... ---
      useEffect(() => {
        // Profil ve sepeti LocalStorage'dan alarak canlandır
        const storedProfile = localStorage.getItem('akma_profile');
        if (storedProfile) {
          setProfile(JSON.parse(storedProfile));
        } else {
          setActiveTab('profile');
        }

        // Eğer Demo/Simülasyon modundaysak verileri LocalStorage üzerinden realtime simüle et
        if (isDemoMode) {
          const storedOrders = localStorage.getItem('akma_orders');
          if (storedOrders) setOrders(JSON.parse(storedOrders));
          
          const storedStaff = localStorage.getItem('akma_staff');
          if (storedStaff) setStaffList(JSON.parse(storedStaff));

          const storedRequests = localStorage.getItem('akma_requests');
          if (storedRequests) setStaffRequests(JSON.parse(storedRequests));
        } else {
          // Canlı Firebase Bağlantı Dinleyicileri
          const unsubscribeOrders = onSnapshot(collection(db, 'orders'), (snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            list.sort((a,b) => b.createdAt - a.createdAt);
            setOrders(list);
          });

          const unsubscribeStaff = onSnapshot(collection(db, 'staff'), (snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setStaffList(list);
          });

          const unsubscribeRequests = onSnapshot(collection(db, 'requests'), (snapshot) => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            setStaffRequests(list);
          });

          return () => {
            unsubscribeOrders();
            unsubscribeStaff();
            unsubscribeRequests();
          };
        }
      }, [role]);

      // --- DİNAMİK FİYATLANDIRMA HESAPLAMA ---
      const getCalculatedPrice = () => {
        // Tek renk seçilmişse 30 TL, karışık veya seçilmemişse 20 TL
        const basePrice = customOptions.selectedColors.length === 1 ? 30 : 20;
        const envelopeCost = customOptions.envelope === 'O ELENDİN Kara Zarf' ? 15 : 0;
        return basePrice + envelopeCost;
      };

      const handleToggleColor = (colorName) => {
        setCustomOptions(prev => {
          const isSelected = prev.selectedColors.includes(colorName);
          const updated = isSelected 
            ? prev.selectedColors.filter(c => c !== colorName)
            : [...prev.selectedColors, colorName];
          return { ...prev, selectedColors: updated };
        });
      };

      // --- STREAMING_CHUNK: Sepete Ekleme ve Sipariş Gönderme... ---
      const handleAddToCart = () => {
        let colorSummary = "Karışık Renkli";
        if (customOptions.selectedColors.length === 1) {
          colorSummary = `Tek Renk (${customOptions.selectedColors[0]})`;
        } else if (customOptions.selectedColors.length > 1) {
          colorSummary = customOptions.selectedColors.join(" + ");
        }

        if (customOptions.customColorText.trim()) {
          colorSummary += ` [Özel: ${customOptions.customColorText.trim()}]`;
        }

        const calculatedPrice = getCalculatedPrice();

        const cartItem = {
          id: Date.now(),
          name: "Düz Bileklik",
          price: calculatedPrice,
          size: customOptions.size,
          envelope: customOptions.envelope,
          colors: colorSummary,
          note: customOptions.note
        };

        setCart(prev => [...prev, cartItem]);
        setCustomOptions(prev => ({ ...prev, selectedColors: [], customColorText: '', note: '' }));
        setActiveTab('cart');
      };

      const handleRemoveFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      // --- SİPARİŞİ TAMAMLAYIP GÖNDERME ---
      const submitOrder = async (e) => {
        e.preventDefault();
        if (!profile.isRegistered) return alert("Sipariş vermeden önce profil oluşturmalısın kanka!");
        if (cart.length === 0) return;

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const orderId = `ORD-${Math.floor(1000 + Math.random() * 9000)}`;

        const newOrder = {
          id: orderId,
          customer: profile.name,
          classRoom: profile.classRoom,
          deskRow: profile.deskRow,
          avatar: profile.avatar,
          items: cart,
          status: "Örülüyor", 
          total: total,
          assignedWeaver: "", 
          assignedCourier: "", 
          createdAt: Date.now()
        };

        if (isDemoMode) {
          // Demo Simülasyon Kaydı
          const updated = [newOrder, ...orders];
          setOrders(updated);
          localStorage.setItem('akma_orders', JSON.stringify(updated));
        } else {
          // Firebase Canlı Kayıt
          await setDoc(doc(db, 'orders', orderId), newOrder);
        }

        setCart([]);
        setShowToast(true);
        setTimeout(() => {
          setShowToast(false);
          setActiveTab('tracking');
        }, 1800);
      };

      // --- PROFİL KAYDETME ---
      const handleSaveProfile = (e) => {
        e.preventDefault();
        if (!profile.name.trim() || !profile.classRoom.trim()) return;

        const updatedProfile = {
          ...profile,
          classRoom: profile.classRoom.toUpperCase(),
          isRegistered: true
        };
        setProfile(updatedProfile);
        localStorage.setItem('akma_profile', JSON.stringify(updatedProfile));
        setActiveTab('catalog');
      };

      // --- ELEMAN BAŞVURUSU GÖNDERME (OTOMATİK PATRONA BİLDİRİM) ---
      const handleSendStaffRequest = async (e) => {
        e.preventDefault();
        if (!staffNameInput.trim()) return;

        const reqId = `REQ-${Math.floor(100 + Math.random() * 900)}`;
        const newRequest = {
          id: reqId,
          name: staffNameInput.trim(),
          role: staffRoleInput,
          createdAt: Date.now()
        };

        if (isDemoMode) {
          const updated = [newRequest, ...staffRequests];
          setStaffRequests(updated);
          localStorage.setItem('akma_requests', JSON.stringify(updated));
        } else {
          await setDoc(doc(db, 'requests', reqId), newRequest);
        }

        alert("Başvurun başarıyla Patron ekranına iletildi! Patron onaylayana kadar bekle kanka.");
        setStaffNameInput("");
      };

      // --- PATRON: BAŞVURU ONAYLAMA ---
      const handleApproveStaff = async (req) => {
        const staffId = `STF-${Math.floor(100 + Math.random() * 900)}`;
        const newStaff = {
          id: staffId,
          name: req.name,
          role: req.role
        };

        if (isDemoMode) {
          // İstek sil
          const updatedRequests = staffRequests.filter(r => r.id !== req.id);
          setStaffRequests(updatedRequests);
          localStorage.setItem('akma_requests', JSON.stringify(updatedRequests));

          // Elemanı ekle
          const updatedStaff = [...staffList, newStaff];
          setStaffList(updatedStaff);
          localStorage.setItem('akma_staff', JSON.stringify(updatedStaff));
        } else {
          await setDoc(doc(db, 'staff', staffId), newStaff);
          await deleteDoc(doc(db, 'requests', req.id));
        }
        alert(`${req.name} başarıyla AKMA kadrosuna alındı!`);
      };

      // --- PATRON: ELEMAN SİLME ---
      const handleDeleteStaff = async (id) => {
        if (isDemoMode) {
          const updated = staffList.filter(s => s.id !== id);
          setStaffList(updated);
          localStorage.setItem('akma_staff', JSON.stringify(updated));
        } else {
          await deleteDoc(doc(db, 'staff', id));
        }
      };

      // --- PATRON: GÖREVLENDİRME ATAMA ---
      const handleAssignStaff = async (orderId, staffName, assignType) => {
        if (isDemoMode) {
          const updated = orders.map(o => {
            if (o.id === orderId) {
              return assignType === 'weaver' 
                ? { ...o, assignedWeaver: staffName }
                : { ...o, assignedCourier: staffName };
            }
            return o;
          });
          setOrders(updated);
          localStorage.setItem('akma_orders', JSON.stringify(updated));
        } else {
          const orderDocRef = doc(db, 'orders', orderId);
          if (assignType === 'weaver') {
            await updateDoc(orderDocRef, { assignedWeaver: staffName });
          } else {
            await updateDoc(orderDocRef, { assignedCourier: staffName });
          }
        }
      };

      // --- SİPARİŞ DURUMUNU İLERLETME ---
      const handleUpdateStatus = async (orderId, currentStatus) => {
        const statusCycle = {
          'Örülüyor': 'Paketlendi',
          'Paketlendi': 'Kuryede',
          'Kuryede': 'Teslim Edildi',
          'Teslim Edildi': 'Teslim Edildi'
        };

        const nextStatus = statusCycle[currentStatus];

        if (isDemoMode) {
          const updated = orders.map(o => {
            if (o.id === orderId) {
              return { ...o, status: nextStatus };
            }
            return o;
          });
          setOrders(updated);
          localStorage.setItem('akma_orders', JSON.stringify(updated));
          
          if (nextStatus === 'Teslim Edildi' && currentStatus !== 'Teslim Edildi') {
            setMoney(m => m + 30); // Sanal kazanç
            setMaterials(mat => Math.max(0, mat - 5));
          }
        } else {
          const orderDocRef = doc(db, 'orders', orderId);
          await updateDoc(orderDocRef, { status: nextStatus });
        }
      };

      // --- PATRON ŞİFRE DOĞRULAMA (1089) ---
      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        if (passwordInput === "1089") {
          setRole('patron');
          setPatronTab('orders');
          setShowPasswordModal(false);
          setPasswordInput("");
        } else {
          alert("Yanlış Şifre Kanka! 1089'u dene.");
        }
      };

      const copyAppUrl = () => {
        const el = document.createElement('textarea');
        el.value = window.location.href;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const myOrders = orders.filter(o => o.userUid === user?.uid);
      const assignedToMeOrders = orders.filter(o => {
        if (!activeStaff) return false;
        return activeStaff.role === 'örüsü' 
          ? o.assignedWeaver === activeStaff.name
          : o.assignedCourier === activeStaff.name;
      });

      // --- STREAMING_CHUNK: Görsel Kod Arayüzünün Render Edilmesi... ---
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between font-sans selection:bg-blue-600/30">
          
          {/* ÜST PANEL */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 backdrop-blur-md">
            <div className="max-w-md mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                {profile.isRegistered && role === 'customer' && (
                  <span className="text-2xl bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 animate-pulse">
                    {profile.avatar}
                  </span>
                )}
                {activeStaff && role === 'staff' && (
                  <span className="text-2xl bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center border border-slate-700">
                    {activeStaff.role === 'örüsü' ? "🪡" : "🛵"}
                  </span>
                )}
                <div>
                  <span className="text-[10px] bg-blue-600/10 text-blue-400 px-2 py-0.5 rounded-full font-black uppercase tracking-widest flex items-center gap-1.5">
                    {dbConnected ? <Icons.Wifi /> : <Icons.WifiOff />}
                    {dbConnected ? "Bulut Aktif" : "Sanal Simülasyon"}
                  </span>
                  <h1 className="text-base font-black text-white italic tracking-tighter mt-0.5">
                    {role === 'customer' && profile.isRegistered ? `${profile.name.toUpperCase()} (${profile.classRoom})` : 
                     role === 'patron' ? "PATRON KABİNİ" : 
                     role === 'staff' && activeStaff ? `${activeStaff.name.toUpperCase()}` : 
                     "AKMA KOLEKTİF"}
                  </h1>
                </div>
              </div>

              <div className="flex gap-2">
                <select 
                  value={role} 
                  onChange={(e) => {
                    const val = e.target.value;
                    if (val === 'patron') {
                      setShowPasswordModal(true);
                    } else if (val === 'staff') {
                      setRole('staff');
                      setActiveStaff(null);
                    } else {
                      setRole('customer');
                    }
                  }}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-full text-xs font-black px-3 py-1.5 outline-none cursor-pointer"
                >
                  <option value="customer">MÜŞTERİ</option>
                  <option value="staff">ELEMAN</option>
                  <option value="patron">🏆 PATRON</option>
                </select>
              </div>
            </div>
          </header>

          {/* ANA GÖVDE */}
          <main className="flex-1 max-w-md w-full mx-auto p-4 space-y-6 pb-24">
            
            {/* ======================================= */}
            {/* MÜŞTERİ MODU                            */}
            {/* ======================================= */}
            {role === 'customer' && (
              <div className="space-y-6">
                
                {/* Alt Tablar */}
                <div className="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
                  {['catalog', 'cart', 'tracking', 'profile'].map(tab => (
                    <button 
                      key={tab}
                      onClick={() => setActiveTab(tab)}
                      className={`flex-1 py-2.5 rounded-xl font-black text-[10px] tracking-tight transition-all ${activeTab === tab ? 'bg-white text-black font-bold' : 'text-slate-500'}`}
                    >

                            </div>
                            <button onClick={() => handleApproveStaff(req)} className="bg-yellow-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-black">ONAYLA</button>
                          </div>
                        ))
                      )}
                    </div>

                    {/* Onaylı Çalışanlar */}
                    <div className="space-y-2">
                      <h4 className="text-xs font-black text-slate-500 uppercase tracking-widest px-1">Kayıtlı Çalışanlar ({staffList.length})</h4>
                      {staffList.map(st => (
                        <div key={st.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                          <div>
                            <p className="font-black text-white text-sm uppercase">{st.name}</p>
                            <p className="text-[10px] text-slate-400 font-bold uppercase mt-0.5">{st.role === 'örüsü' ? '🪡 Örücü' : '🛵 Kurye'}</p>
                          </div>
                          <button onClick={() => handleDeleteStaff(st.id)} className="text-red-500 p-2"><Icons.Trash2 /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* KASA & STOK YÖNETİMİ */}
                {patronTab === 'resources' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 gap-3">
                      <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl">
                        <p className="text-[9px] text-slate-500 font-black uppercase">TOPLAM KASA</p>
                        <p className="text-2xl font-black text-yellow-400 font-mono">{money}₺</p>
                      </div>
                      <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl">
                        <p className="text-[9px] text-slate-500 font-black uppercase">LASTİK HAMMADDE</p>
                        <p className="text-2xl font-black text-blue-400 font-mono">{materials} ADET</p>
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-[2.5rem] space-y-4">
                      <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest">Çarşı Toptancısından Lastik İp Satın Al</h4>
                      <button 
                        onClick={() => {
                          if (money >= 150) {
                            setMoney(m => m - 150);
                            setMaterials(mat => mat + 350);
                          }
                        }}
                        className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-2xl font-black text-xs flex justify-between px-6 items-center"
                      >
                        <span>350 ADET RENKLİ LASTİK İP</span>
                        <span>150₺</span>
                      </button>
                    </div>
                  </div>
                )}

              </div>
            )}

          </main>

          {/* SİPARİŞ BAŞARILI TOAST */}
          {showToast && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-[3rem] text-center max-w-xs w-full shadow-2xl">
                 <div className="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/20">
                    <Icons.Check />
                 </div>
                 <h3 className="font-black text-lg text-white">SİPARİŞ ALINDI!</h3>
                 <p className="text-xs text-slate-400 mt-2">Siparişin buluta başarıyla kaydedildi kanka! Örücü ve Kurye ekibimiz atandıktan sonra hazırlık başlayacak.</p>
              </div>
            </div>
          )}

          {/* ŞİFRE MODAL (1089) */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[120] flex items-center justify-center p-4">
              <form onSubmit={handlePasswordSubmit} className="bg-slate-900 border border-slate-800 p-8 rounded-[3rem] text-center max-w-xs w-full shadow-2xl space-y-6">
                 <div className="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mx-auto border border-yellow-500/20">
                    <span className="text-3xl">🔑</span>
                 </div>
                 <div className="space-y-1">
                    <h3 className="font-black text-lg text-white">Patron Yetki Girişi</h3>
                    <p className="text-xs text-slate-400">Yönetim kabinine erişmek için 4 haneli şifreyi gir kanka.</p>
                 </div>
                 <input 
                    type="password" 
                    required
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder="Şifre"
                    className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl text-center text-xl font-mono text-white outline-none tracking-widest focus:border-yellow-500 transition-all"
                 />
                 <div className="flex gap-2">
                    <button type="button" onClick={() => { setShowPasswordModal(false); setRole('customer'); }} className="flex-1 py-3 bg-slate-800 rounded-xl text-xs font-bold text-slate-400">Vazgeç</button>
                    <button type="submit" className="flex-1 py-3 bg-yellow-500 text-slate-950 rounded-xl text-xs font-black">GİRİŞ</button>
                 </div>
              </form>
            </div>
          )}

          {/* ALT BİLGİ BANNERI */}
          <footer className="bg-slate-950 p-4 border-t border-slate-900 text-center text-[10px] text-slate-600 font-bold uppercase tracking-widest">
             AKMA KOLEKTİF • GAZİANTEP MERKEZ SIRALAR
          </footer>

        </div>
      );
    };

    // React'ı ekrana yerleştirme
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
