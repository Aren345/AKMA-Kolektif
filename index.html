<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AKMA Lastik Savaşları</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    canvas {
      display: block;
      background: radial-gradient(circle, #0f172a 0%, #020617 100%);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-hidden flex flex-col justify-between">

  <!-- Oyun Arayüzü -->
  <div class="absolute top-4 left-4 z-10 pointer-events-none">
    <div class="bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2.5 rounded-2xl">
      <span class="text-[9px] text-blue-400 font-black uppercase tracking-widest block">Skor</span>
      <span id="score-val" class="text-xl font-black font-mono text-white">0</span>
    </div>
  </div>

  <div class="absolute top-4 right-4 z-10 pointer-events-none">
    <div class="bg-slate-900/80 backdrop-blur border border-slate-800 px-4 py-2.5 rounded-2xl text-right">
      <span class="text-[9px] text-red-500 font-black uppercase tracking-widest block">Can</span>
      <span id="lives-val" class="text-xl font-black font-mono text-red-400">❤❤❤</span>
    </div>
  </div>

  <!-- Oyun Alanı -->
  <canvas id="gameCanvas" class="w-full h-full flex-1"></canvas>

  <!-- Game Over Ekranı -->
  <div id="gameOverScreen" class="hidden fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2.5rem] text-center max-w-xs w-full shadow-2xl space-y-6">
      <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto border border-red-500/20">
        <span class="text-3xl">💥</span>
      </div>
      <div class="space-y-1">
        <h3 class="font-black text-xl text-white">OYUN BİTTİ!</h3>
        <p class="text-xs text-slate-400">Faruk'un tahta karalamaları sıramızı işgal etti!</p>
      </div>
      <div class="bg-slate-950 p-3 rounded-2xl border border-slate-850">
        <span class="text-[9px] text-slate-500 font-bold block uppercase">Yaptığın Skor</span>
        <span id="final-score" class="text-2xl font-black font-mono text-green-400">0</span>
      </div>
      <button 
        id="restartBtn" 
        class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black text-xs uppercase tracking-wider transition-all"
      >
        Yeniden Başla
      </button>
    </div>
  </div>

  <!-- Kontrol Kılavuzu -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 bg-slate-900/40 backdrop-blur-sm border border-slate-800/40 px-6 py-2.5 rounded-full text-center pointer-events-none">
    <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest">
      Sapanı çek, hedefi vur kanka!
    </p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Skor ve Can Elementleri
    const scoreVal = document.getElementById('score-val');
    const livesVal = document.getElementById('lives-val');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('final-score');
    const restartBtn = document.getElementById('restartBtn');

    // Oyun State'i
    let gameActive = true;
    let score = 0;
    let lives = 3;

    // Sapan (Sling) Bilgileri
    const sling = {
      x: 0,
      y: 0,
      radius: 20,
      dragX: 0,
      dragY: 0,
      isDragging: false,
      maxDrag: 80
    };

    // Diziler
    let projectiles = [];
    let targets = [];
    let particles = [];

    // Canvas Boyutlandırma
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      sling.x = canvas.width / 2;
      sling.y = canvas.height - 120;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ses Efektleri (Kararlı sentetik Web Audio)
    function playTone(freq, duration, type = 'sine') {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Dokunmatik / Fare Olayları
    function getEventPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrag(e) {
      if (!gameActive) return;
      const pos = getEventPos(e);
      const dist = Math.hypot(pos.x - sling.x, pos.y - sling.y);
      if (dist < 40) {
        sling.isDragging = true;
        sling.dragX = pos.x;
        sling.dragY = pos.y;
        playTone(300, 0.1, 'triangle');
      }
    }

    function drag(e) {
      if (!sling.isDragging) return;
      const pos = getEventPos(e);
      const angle = Math.atan2(pos.y - sling.y, pos.x - sling.x);
      const dist = Math.min(Math.hypot(pos.x - sling.x, pos.y - sling.y), sling.maxDrag);
      
      sling.dragX = sling.x + Math.cos(angle) * dist;
      sling.dragY = sling.y + Math.sin(angle) * dist;
    }

    function endDrag() {
      if (!sling.isDragging) return;
      sling.isDragging = false;

      // Hızı sapanın çekilme mesafesine göre ayarla
      const dx = sling.x - sling.dragX;
      const dy = sling.y - sling.dragY;
      const power = 0.18;

      projectiles.push({
        x: sling.x,
        y: sling.y,
        vx: dx * power,
        vy: dy * power,
        radius: 6
      });

      playTone(600, 0.2, 'sawtooth');
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('mousemove', drag);
    canvas.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drag(e); });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); endDrag(); });

    // Parçacık Patlama Efekti
    function spawnParticles(x, y, color) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.01
        });
      }
    }

    // Hedefleri Güncelle / Oluştur
    function spawnTarget() {
      if (!gameActive) return;
      const radius = Math.random() * 15 + 15;
      targets.push({
        x: Math.random() * (canvas.width - radius * 2) + radius,
        y: -radius,
        vy: Math.random() * 2 + 1 + (score * 0.05),
        radius: radius,
        color: `hsl(${Math.random() * 360}, 80%, 60%)`
      });
    }

    let spawnTimer = setInterval(spawnTarget, 1500);

    // Fizik ve Render Döngüsü
    function update() {
      // 1. Mermileri Güncelle
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx;
        p.y += p.vy;
        // Ekrandan çıkanları sil
        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
          projectiles.splice(i, 1);
        }
      }

      // 2. Hedefleri Güncelle
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.y += t.vy;

        // Hedef tabana ulaşırsa can git
        if (t.y - t.radius > canvas.height) {
          targets.splice(i, 1);
          lives--;
          playTone(150, 0.3, 'sine');
          livesVal.innerText = "❤".repeat(Math.max(0, lives));
          
          if (lives <= 0) {
            gameActive = false;
            gameOverScreen.classList.remove('hidden');
            finalScore.innerText = score;
          }
          continue;
        }

        // Çarpışma Kontrolü (Mermi - Hedef)
        for (let j = projectiles.length - 1; j >= 0; j--) {
          const p = projectiles[j];
          const dist = Math.hypot(p.x - t.x, p.y - t.y);
          if (dist < t.radius + p.radius) {
            spawnParticles(t.x, t.y, t.color);
            targets.splice(i, 1);
            projectiles.splice(j, 1);
            score += 10;
            scoreVal.innerText = score;
            playTone(400 + (score * 2), 0.15, 'triangle');
            break;
          }
        }
      }

      // 3. Parçacıkları Güncelle
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sapan Direklerini Çiz
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sling.x - 30, sling.y);
      ctx.lineTo(sling.x - 30, sling.y + 40);
      ctx.moveTo(sling.x + 30, sling.y);
      ctx.lineTo(sling.x + 30, sling.y + 40);
      ctx.stroke();

      // Çekilme Aşamasındaki Lastiği Çiz
      if (sling.isDragging) {
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sling.x - 30, sling.y);
        ctx.lineTo(sling.dragX, sling.dragY);
        ctx.lineTo(sling.x + 30, sling.y);
        ctx.stroke();

        // Çekilen Mermiyi Çiz
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(sling.dragX, sling.dragY, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Dinlenme Durumundaki Lastiği Çiz
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sling.x - 30, sling.y);
        ctx.lineTo(sling.x + 30, sling.y);
        ctx.stroke();
      }

      // Mermileri Çiz
      ctx.fillStyle = '#f8fafc';
      for (const p of projectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Hedefleri Çiz
      for (const t of targets) {
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Parçacıkları Çiz
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // Oyun Döngüsü
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Yeniden Başlatma Mekanizması
    restartBtn.addEventListener('click', () => {
      score = 0;
      lives = 3;
      projectiles = [];
      targets = [];
      particles = [];
      gameActive = true;
      scoreVal.innerText = '0';
      livesVal.innerText = '❤❤❤';
      gameOverScreen.classList.add('hidden');
    });

    // Başlat
    gameLoop();
  </script>
</body>
</html>
