<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKMA Kolektif - Sipariş & Eleman Ağı</title>
  
  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone (JSX derlemek için) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    html, body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <!-- React & Firebase Kod Bloğu -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- POPÜLER RENK SEÇENEKLERİ ---
    const COLOR_OPTIONS = [
      { id: 'siyah', name: 'Siyah', hex: '#000000' },
      { id: 'beyaz', name: 'Beyaz', hex: '#FFFFFF' },
      { id: 'kirmizi', name: 'Kırmızı', hex: '#EF4444' },
      { id: 'mavi', name: 'Mavi', hex: '#3B82F6' },
      { id: 'yesil', name: 'Yeşil', hex: '#10B981' },
      { id: 'sari', name: 'Sarı', hex: '#FBBF24' },
      { id: 'turuncu', name: 'Turuncu', hex: '#F97316' },
      { id: 'mor', name: 'Mor', hex: '#A855F7' },
      { id: 'pembe', name: 'Pembe', hex: '#EC4899' },
      { id: 'turkuaz', name: 'Turkuaz', hex: '#06B6D4' },
      { id: 'lacivert', name: 'Lacivert', hex: '#1E3A8A' }
    ];

    const AVATAR_OPTIONS = ["🦁", "🐼", "🦊", "🐯", "🐱", "🐨", "🐸", "🐵", "👑", "🚀", "⚡", "👾"];

    // --- FIREBASE YAPILANDIRMASI ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "mock-api-key",
          authDomain: "mock-auth-domain",
          projectId: "mock-project-with-friendly-permissions",
          storageBucket: "mock-storage",
          messagingSenderId: "mock-sender",
          appId: "mock-app"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'akma-siparis-v12';

    const { useState, useEffect } = React;

    // --- ÖZEL İKON KÜTÜPHANESİ ---
    const Icons = {
      Wifi: () => (
        <svg className="w-3.5 h-3.5 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M5 12.5a13.38 13.38 0 0 1 14 0" /><path d="M8.5 16.29a8.34 8.34 0 0 1 7 0" /><path d="M12 20h.01" />
        </svg>
      ),
      WifiOff: () => (
        <svg className="w-3.5 h-3.5 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84" /><path d="M12 20h.01" />
        </svg>
      ),
      ShoppingBag: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" /><line x1="3" y1="6" x2="21" y2="6" /><path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      ),
      Scissors: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="9.8" y1="8.2" x2="21" y2="19.4" /><line x1="21" y1="4.6" x2="14.5" y2="11" /><line x1="11" y1="14.5" x2="8.2" y2="17.3" />
        </svg>
      ),
      Users: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      ),
      Trash2: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
        </svg>
      ),
      MapPin: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />
        </svg>
      ),
      Send: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      ),
      ShieldAlert: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      ),
      Check: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
      Plus: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      ),
      Copy: ({ size = 16, className = "" }) => (
        <svg className={`${className}`} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      )
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [dbConnected, setDbConnected] = useState(false);
      
      // Rol Yönetimi: 'customer', 'patron', 'staff'
      const [role, setRole] = useState('customer'); 
      const [activeTab, setActiveTab] = useState('catalog'); // customer tab: 'catalog', 'cart', 'tracking', 'profile'
      const [patronTab, setPatronTab] = useState('orders'); // patron tab: 'orders', 'staff', 'verification'
      
      const [cart, setCart] = useState([]);
      const [showToast, setShowToast] = useState(false);
      const [copied, setCopied] = useState(false);

      // Şifre Giriş Ekranı Kontrolü (1089)
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState("");
      
      // Eleman Sistemi
      const [myStaffProfile, setMyStaffProfile] = useState(null); // Elemanın onaylı bulut profili
      const [staffRequestSent, setStaffRequestSent] = useState(false);
      const [staffNameInput, setStaffNameInput] = useState("");
      const [staffRoleInput, setStaffRoleInput] = useState("örüsü");

      // Profil State (Müşteri)
      const [profile, setProfile] = useState({
        name: '',
        classRoom: '', 
        deskRow: 'Orta Sıra',
        avatar: '🦁',
        isRegistered: false
      });

      // Özelleştirme State'i (Tek Tip Düz Bileklik)
      const [customOptions, setCustomOptions] = useState({
        size: 'M (Standart)',
        envelope: 'Standart Şeffaf',
        selectedColors: [], 
        customColorText: '', 
        note: ''
      });

      // Firestore Canlı Verileri
      const [orders, setOrders] = useState([]);
      const [staffList, setStaffList] = useState([]);
      const [pendingStaffRequests, setPendingStaffRequests] = useState([]);

      const [materials, setMaterials] = useState(500); 
      const [money, setMoney] = useState(1500); 

      // --- SENTETİK BİLDİRİM SESİ ---
      const playNotificationSound = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12); 
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {
          console.log("Ses çalma engellendi.");
        }
      };

      // --- FIREBASE ANA AUTHENTICATION (RULE 3) ---
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error("Kimlik doğrulama hatası:", err);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            setDbConnected(true);
            loadUserProfile(currentUser.uid);
            checkStaffStatus(currentUser.uid);
          }
        });

        return () => unsubscribe();
      }, []);

      // --- KULLANICI PROFİL VERİSİNİ AL ---
      const loadUserProfile = async (uid) => {
        try {
          const profileDocRef = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data');
          const docSnap = await getDoc(profileDocRef);
          if (docSnap.exists()) {
            setProfile({ ...docSnap.data(), isRegistered: true });
          } else {
            setActiveTab('profile'); // Profil zorunlu
          }
        } catch (err) {
          console.error("Profil yükleme hatası:", err);
        }
      };

      // --- ELEMAN ONUR/ONAY DURUMU SORGULAMA ---
      const checkStaffStatus = (uid) => {
        // Aktif Eleman sorgulama
        const staffDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', uid);
        onSnapshot(staffDocRef, (docSnap) => {
          if (docSnap.exists()) {
            setMyStaffProfile(docSnap.data());
          } else {
            setMyStaffProfile(null);
            // Onay bekleyen istek var mı kontrol et
            const requestDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staffRequests', uid);
            getDoc(requestDocRef).then((reqSnap) => {
              if (reqSnap.exists()) {
                setStaffRequestSent(true);
              } else {
                setStaffRequestSent(false);
              }
            });
          }
        });
      };

      // --- REALTIME SİPARİŞ & ELEMAN DİNLEYİCİLERİ ---
      useEffect(() => {
        if (!user) return;

        // Siparişleri Dinleme
        const ordersColRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        const unsubscribeOrders = onSnapshot(ordersColRef, 
          (snapshot) => {
            const fetchedOrders = [];
            snapshot.forEach((doc) => {
              fetchedOrders.push({ id: doc.id, ...doc.data() });
            });
            fetchedOrders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            if (role === 'patron' && orders.length > 0 && fetchedOrders.length > orders.length) {
              playNotificationSound();
            }
            setOrders(fetchedOrders);
            setDbConnected(true);
          },
          () => setDbConnected(false)
        );

        // Onaylı Eleman Listesini Dinleme
        const staffColRef = collection(db, 'artifacts', appId, 'public', 'data', 'staff');
        const unsubscribeStaff = onSnapshot(staffColRef,
          (snapshot) => {
            const fetchedStaff = [];
            snapshot.forEach((doc) => {
              fetchedStaff.push({ id: doc.id, ...doc.data() });
            });
            setStaffList(fetchedStaff);
          },
          (err) => console.error("Eleman listesi çekilemedi:", err)
        );

        // Onay Bekleyen Eleman Başvurularını Dinleme (Sadece Patron Görür)
        const requestsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'staffRequests');
        const unsubscribeRequests = onSnapshot(requestsColRef,
          (snapshot) => {
            const fetchedRequests = [];
            snapshot.forEach((doc) => {
              fetchedRequests.push({ id: doc.id, ...doc.data() });
            });
            setPendingStaffRequests(fetchedRequests);
          },
          (err) => console.error("Başvurular çekilemedi:", err)
        );

        return () => {
          unsubscribeOrders();
          unsubscribeStaff();
          unsubscribeRequests();
        };
      }, [user, orders.length, role]);

      // --- DİNAMİK FİYAT HESAPLAMA (Tek renk: 30, Çoklu/Yok: 20) ---
      const getCalculatedPrice = () => {
        const basePrice = customOptions.selectedColors.length === 1 ? 30 : 20;
        const envelopeCost = customOptions.envelope === 'O ELENDİN Kara Zarf' ? 15 : 0;
        return basePrice + envelopeCost;
      };

      const handleToggleColor = (colorName) => {
        setCustomOptions(prev => {
          const isSelected = prev.selectedColors.includes(colorName);
          const updated = isSelected 
            ? prev.selectedColors.filter(c => c !== colorName)
            : [...prev.selectedColors, colorName];
          return { ...prev, selectedColors: updated };
        });
      };

      // --- SEPET İŞLEMLERİ ---
      const handleAddToCart = () => {
        let colorSummary = "Karışık Renkli";
        if (customOptions.selectedColors.length === 1) {
          colorSummary = `Tek Renk (${customOptions.selectedColors[0]})`;
        } else if (customOptions.selectedColors.length > 1) {
          colorSummary = customOptions.selectedColors.join(" + ");
        }

        if (customOptions.customColorText.trim()) {
          colorSummary += ` [Özel: ${customOptions.customColorText.trim()}]`;
        }

        const calculatedPrice = getCalculatedPrice();

        const cartItem = {
          id: Date.now(),
          name: "Düz Bileklik",
          price: calculatedPrice,
          size: customOptions.size,
          envelope: customOptions.envelope,
          colors: colorSummary,
          note: customOptions.note
        };

        setCart(prev => [...prev, cartItem]);
        setCustomOptions(prev => ({ 
          ...prev, 
          selectedColors: [], 
          customColorText: '', 
          note: '' 
        }));
        setActiveTab('cart');
      };

      const handleRemoveFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      // --- SİPARİŞİ GÖNDERME ---
      const submitOrder = async (e) => {
        e.preventDefault();
        if (!profile.isRegistered) return alert("Sipariş vermeden önce profil oluşturmalısın kanka!");
        if (cart.length === 0 || !user) return;

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const orderId = `ORD-${Math.floor(1000 + Math.random() * 9000)}`;

        const newOrder = {
          customer: profile.name,
          classRoom: profile.classRoom,
          deskRow: profile.deskRow,
          avatar: profile.avatar,
          items: cart,
          status: "Örülüyor", 
          total: total,
          userUid: user.uid,
          assignedWeaver: "", 
          assignedCourier: "", 
          createdAt: Date.now()
        };

        try {
          const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
          await setDoc(orderDocRef, newOrder);
          setCart([]);
          setShowToast(true);
          setTimeout(() => {
            setShowToast(false);
            setActiveTab('tracking');
          }, 2000);
        } catch (err) {
          console.error("Sipariş gönderilemedi:", err);
        }
      };

      // --- PROFİL KAYDETME (MÜŞTERİ) ---
      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!profile.name.trim() || !profile.classRoom.trim() || !user) return;

        const updatedProfile = {
          name: profile.name,
          classRoom: profile.classRoom.trim().toUpperCase(),
          deskRow: profile.deskRow,
          avatar: profile.avatar,
          updatedAt: Date.now()
        };

        try {
          const profileDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
          await setDoc(profileDocRef, updatedProfile);
          setProfile(prev => ({ ...prev, ...updatedProfile, isRegistered: true }));
          setActiveTab('catalog');
        } catch (err) {
          console.error("Profil kaydedilemedi:", err);
        }
      };

      // --- ELEMAN DOĞRULAMA BAŞVURUSU GÖNDERME ---
      const handleSendStaffRequest = async (e) => {
        e.preventDefault();
        if (!staffNameInput.trim() || !user) return;

        const requestDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staffRequests', user.uid);
        const newRequest = {
          uid: user.uid,
          name: staffNameInput.trim(),
          role: staffRoleInput,
          createdAt: Date.now()
        };

        try {
          await setDoc(requestDocRef, newRequest);
          setStaffRequestSent(true);
          alert("Doğrulama isteğin Patron paneline otomatik iletildi kanka. Patron onaylayınca panelin açılacak!");
        } catch (err) {
          console.error("Başvuru gönderilemedi:", err);
        }
      };

      // --- PATRON: ELEMAN BAŞVURUSUNU ONAYLAMA ---
      const handleApproveStaff = async (req) => {
        if (!user) return;
        const staffDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', req.uid);
        const requestDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staffRequests', req.uid);

        try {
          // Onaylı eleman kadrosuna ekle
          await setDoc(staffDocRef, {
            id: req.uid,
            name: req.name,
            role: req.role
          });
          // Başvuru dökümanını sil
          await deleteDoc(requestDocRef);
          alert(`${req.name} başarıyla ekibe dahil edildi!`);
        } catch (err) {
          console.error("Eleman onaylama hatası:", err);
        }
      };

      // --- PATRON: ELEMAN BAŞVURUSUNU REDDETME ---
      const handleRejectStaff = async (uid) => {
        if (!user) return;
        const requestDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staffRequests', uid);
        try {
          await deleteDoc(requestDocRef);
        } catch (err) {
          console.error("Başvuru reddetme hatası:", err);
        }
      };

      // --- PATRON: ELEMAN SİLME ---
      const handleDeleteStaff = async (id) => {
        if (!user) return;
        try {
          const staffDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', id);
          await deleteDoc(staffDocRef);
        } catch (err) {
          console.error("Eleman silinemedi:", err);
        }
      };

      // --- PATRON: ELEMAN ATAMA (GÖREVLENDİRME) ---
      const handleAssignStaff = async (orderId, staffName, assignType) => {
        if (!user) return;
        const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
        try {
          if (assignType === 'weaver') {
            await updateDoc(orderDocRef, { assignedWeaver: staffName });
          } else {
            await updateDoc(orderDocRef, { assignedCourier: staffName });
          }
        } catch (err) {
          console.error("Eleman atama hatası:", err);
        }
      };

      // --- SİPARİŞ DURUM GÜNCELLEMESİ (CANLI ZİNCİR) ---
      const handleUpdateStatus = async (orderId, currentStatus) => {
        if (!user) return;

        const statusCycle = {
          'Örülüyor': 'Paketlendi',
          'Paketlendi': 'Kuryede',
          'Kuryede': 'Teslim Edildi',
          'Teslim Edildi': 'Teslim Edildi'
        };

        const nextStatus = statusCycle[currentStatus];
        const orderDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);

        try {
          await updateDoc(orderDocRef, { status: nextStatus });
          if (nextStatus === 'Teslim Edildi' && currentStatus !== 'Teslim Edildi') {
            const order = orders.find(o => o.id === orderId);
            if (order) {
              setMoney(m => m + order.total);
              setMaterials(mat => Math.max(0, mat - (order.items.length * 5)));
            }
          }
        } catch (err) {
          console.error("Durum güncellenemedi:", err);
        }
      };

      // --- ŞİFRE KONTROLÜ (1089) ---
      const handlePasswordSubmit = (e) => {
        e.preventDefault();
        if (passwordInput === "1089") {
          setRole('patron');
          setPatronTab('orders');
          setShowPasswordModal(false);
          setPasswordInput("");
        } else {
          alert("Şifre Yanlış Kanka! 1089'u dene.");
        }
      };

      const copyAppUrl = () => {
        const el = document.createElement('textarea');
        el.value = window.location.href;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      // Filtrelenmiş Sipariş Listeleri
      const myOrders = orders.filter(o => o.userUid === user?.uid);

                              type="button" 
                              onClick={() => setStaffRoleInput('kurye')} 
                              className={`py-3 rounded-2xl text-xs font-bold border transition-all ${staffRoleInput === 'kurye' ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-800 border-slate-700 text-slate-500'}`}
                            >
                              🛵 Kurye
                            </button>
                          </div>
                        </div>

                        <button type="submit" className="w-full py-4 bg-blue-600 rounded-2xl font-black text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all">
                          <Icons.Send size={14}/> DOĞRULAMA İSTEĞİ GÖNDER
                        </button>
                      </div>
                    )}

                    {staffRequestSent && (
                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center text-xs text-yellow-500 font-bold">
                        ⏳ Patronun seni onaylaması bekleniyor...
                      </div>
                    )}
                  </form>
                ) : (
                  // Giriş yapmış onaylı eleman paneli
                  <div className="space-y-6 animate-in fade-in duration-300">
                    <div className="bg-gradient-to-br from-indigo-950 to-slate-950 border border-slate-800 p-6 rounded-[2rem] flex justify-between items-center">
                      <div>
                        <span className="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Onaylı Çalışan Ekranı</span>
                        <h2 className="text-xl font-black text-white">{myStaffProfile.name.toUpperCase()}</h2>
                        <p className="text-xs text-indigo-400 font-black mt-1 uppercase tracking-wider">
                          GÖREV: {myStaffProfile.role === 'örüsü' ? '🪡 Örücü (İmalat)' : '🛵 Kurye (Dağıtım)'}
                        </p>
                      </div>
                      <span className="text-xs bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1.5 rounded-full font-black">ONAYLI ✓</span>
                    </div>

                    <div className="space-y-3">
                      <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest px-1">Sana Atanan Canlı Siparişler</h3>
                      
                      {assignedToMeOrders.length === 0 ? (
                        <div className="text-center py-16 bg-slate-900/30 border border-slate-800 rounded-3xl text-slate-500 text-xs">
                          Şu an sana atanan herhangi bir sipariş bulunmuyor kanka. Dinlen!
                        </div>
                      ) : (
                        assignedToMeOrders.map(order => (
                          <div key={order.id} className="bg-slate-900 border border-slate-800 p-5 rounded-[2rem] space-y-4 border-l-4 border-l-indigo-500">
                            <div className="flex justify-between items-start">
                              <div>
                                <span className="text-[9px] font-mono text-indigo-400 font-black">{order.id}</span>
                                <h4 className="font-black text-sm text-white">{order.customer} ({order.classRoom})</h4>
                                <p className="text-[10px] text-slate-400">{order.deskRow}</p>
                              </div>
                              <span className="text-xs font-black text-green-400 font-mono">{order.total}₺</span>
                            </div>

                            <div className="space-y-1.5 bg-black/40 p-3 rounded-xl border border-slate-950 text-xs font-bold text-slate-400">
                              {order.items.map((item, i) => (
                                <div key={i} className="flex justify-between">
                                  <span>{item.name} ({item.size}) • {item.envelope}</span>
                                  <span>{item.price}₺</span>
                                </div>
                              ))}
                            </div>

                            <button
                              onClick={() => handleUpdateStatus(order.id, order.status)}
                              disabled={order.status === 'Teslim Edildi'}
                              className={`w-full py-3.5 rounded-2xl font-black text-xs uppercase tracking-wider transition-all ${
                                order.status === 'Örülüyor' ? 'bg-orange-600 hover:bg-orange-500 text-white' :
                                order.status === 'Paketlendi' ? 'bg-blue-600 hover:bg-blue-500 text-white' :
                                order.status === 'Kuryede' ? 'bg-purple-600 hover:bg-purple-500 text-white animate-pulse' :
                                'bg-slate-800 text-slate-500 cursor-not-allowed'
                              }`}
                            >
                              {order.status === 'Örülüyor' && 'ÖRGÜYÜ BİTİR VE PAKETLE'}
                              {order.status === 'Paketlendi' && 'KURYEYE BAŞLAT (YOLA ÇIKAR)'}
                              {order.status === 'Kuryede' && 'TESLİMATI TAMAMLA (SIRAYA BIRAKILDI)'}
                              {order.status === 'Teslim Edildi' && 'İŞLEM BİTTİ ✔️'}
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ======================================= */}
            {/* 3. PATRON MODU                          */}
            {/* ======================================= */}
            {role === 'patron' && (
              <div className="space-y-6 animate-in fade-in duration-300">
                
                {/* Patron Tab Değiştirici */}
                <div className="flex bg-slate-900 p-1 rounded-2xl border border-slate-800 text-[10px] font-black uppercase tracking-wider">
                  <button onClick={() => setPatronTab('orders')} className={`flex-1 py-2.5 rounded-xl transition-all ${patronTab === 'orders' ? 'bg-white text-black' : 'text-slate-500'}`}>SİPARİŞLER ({orders.length})</button>
                  <button onClick={() => setPatronTab('staff')} className={`flex-1 py-2.5 rounded-xl transition-all ${patronTab === 'staff' ? 'bg-white text-black' : 'text-slate-500'}`}>KADRO ({staffList.length})</button>
                  <button onClick={() => setPatronTab('verification')} className={`flex-1 py-2.5 rounded-xl transition-all relative ${patronTab === 'verification' ? 'bg-white text-black' : 'text-slate-500'}`}>
                    BAŞVURULAR ({pendingStaffRequests.length})
                    {pendingStaffRequests.length > 0 && <span className="absolute top-1.5 right-1.5 bg-red-500 w-2.5 h-2.5 rounded-full animate-ping"></span>}
                  </button>
                </div>

                {/* PATRON TAB: SİPARİŞLER */}
                {patronTab === 'orders' && (
                  <div className="space-y-4">
                    <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest px-1">Sıra Altından Gelen Siparişler</h3>
                    
                    {orders.length === 0 ? (
                      <div className="text-center py-16 bg-slate-900/30 border border-slate-800 rounded-3xl text-slate-500 text-xs">
                        Henüz sipariş yok kanka korta / sınıfa linki dağıt!
                      </div>
                    ) : (
                      orders.map(order => (
                        <div key={order.id} className="bg-slate-900 border border-slate-800 p-5 rounded-[2rem] space-y-4 border-l-4 border-l-blue-500">
                          <div className="flex justify-between items-start">
                            <div className="flex items-center gap-3">
                              <span className="text-2xl">{order.avatar}</span>
                              <div>
                                <span className="text-[9px] font-mono text-blue-400 font-black">{order.id}</span>
                                <h4 className="font-black text-sm text-white">{order.customer} ({order.classRoom})</h4>
                                <p className="text-[10px] text-slate-400">{order.deskRow}</p>
                              </div>
                            </div>
                            <span className="text-xs font-black text-green-400">{order.total}₺</span>
                          </div>

                          <div className="space-y-1 bg-black/40 p-3 rounded-xl border border-slate-950 text-xs font-bold text-slate-400">
                            {order.items.map((item, i) => (
                              <div key={i} className="flex justify-between">
                                <div>
                                  <p>{item.name} ({item.size}) • {item.envelope}</p>
                                  <p className="text-[9px] text-blue-400">Tasarım: {item.colors}</p>
                                </div>
                                <span>{item.price}₺</span>
                              </div>
                            ))}
                          </div>

                          {/* İŞ BÖLÜMÜ / GÖREVLENDİRME ALANI */}
                          <div className="grid grid-cols-2 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800/80 text-[10px] space-y-1">
                            {/* Örücü Atama */}
                            <div className="space-y-1">
                              <label className="font-black text-slate-500 uppercase">🔨 ÖRÜCÜ ATAMA</label>
                              <select 
                                value={order.assignedWeaver || ""} 
                                onChange={(e) => handleAssignStaff(order.id, e.target.value, 'weaver')}
                                className="w-full bg-slate-900 text-white font-bold p-2 rounded-xl outline-none"
                              >
                                <option value="">Seçilmedi</option>
                                {staffList.filter(s => s.role === 'örüsü').map(st => (
                                  <option key={st.id} value={st.name}>{st.name}</option>
                                ))}
                              </select>
                            </div>

                            {/* Kurye Atama */}
                            <div className="space-y-1">
                              <label className="font-black text-slate-500 uppercase">🛵 KURYE ATAMA</label>
                              <select 
                                value={order.assignedCourier || ""} 
                                onChange={(e) => handleAssignStaff(order.id, e.target.value, 'courier')}
                                className="w-full bg-slate-900 text-white font-bold p-2 rounded-xl outline-none"
                              >
                                <option value="">Seçilmedi</option>
                                {staffList.filter(s => s.role === 'kurye').map(st => (
                                  <option key={st.id} value={st.name}>{st.name}</option>
                                ))}
                              </select>
                            </div>
                          </div>

                          {/* Manuel Durum İlerletme */}
                          <div className="pt-2">
                            <button
                              onClick={() => handleUpdateStatus(order.id, order.status)}
                              disabled={order.status === 'Teslim Edildi'}
                              className="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-black text-xs uppercase"
                            >
                              YÖNETİCİ GÜNCELLE: {order.status}
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {/* PATRON TAB: KADRO YÖNETİMİ */}
                {patronTab === 'staff' && (
                  <div className="space-y-4">
                    <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest px-1">Aktif Eleman Kadrosu ({staffList.length})</h3>
                    {staffList.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-4 bg-slate-900/30 rounded-2xl border border-slate-900">Kayıtlı onaylı eleman yok.</p>
                    ) : (
                      staffList.map(st => (
                        <div key={st.id} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                          <div>
                            <p className="font-black text-white text-sm uppercase">{st.name}</p>
                            <p className="text-[10px] text-slate-400 font-bold uppercase mt-0.5">{st.role === 'örüsü' ? '🪡 Örücü' : '🛵 Dağıtıcı Kurye'}</p>
                          </div>
                          <button 
                            onClick={() => handleDeleteStaff(st.id)}
                            className="text-red-500 p-2 hover:bg-red-500/10 rounded-xl"
                          >
                            <Icons.Trash2 size={16}/>
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                )}

                {/* PATRON TAB: DOĞRULAMA BAŞVURULARI */}
                {patronTab === 'verification' && (
                  <div className="space-y-4">
                    <h3 className="text-xs font-black text-slate-500 uppercase tracking-widest px-1">Doğrulama Bekleyen Başvurular</h3>
                    {pendingStaffRequests.length === 0 ? (
                      <div className="text-center py-12 bg-slate-900/40 rounded-3xl border border-slate-800 text-slate-500 text-xs">
                        Yeni doğrulama başvurusu bulunmuyor kanka.
                      </div>
                    ) : (
                      pendingStaffRequests.map(req => (
                        <div key={req.id} className="bg-slate-900 border border-slate-800 p-4 rounded-3xl flex justify-between items-center">
                          <div>
                            <p className="font-black text-white text-sm uppercase">{req.name}</p>
                            <p className="text-[10px] text-yellow-500 font-bold uppercase mt-0.5">{req.role === 'örüsü' ? '🔨 Örücü Başvurusu' : '🛵 Kurye Başvurusu'}</p>
                          </div>
                          <div className="flex gap-2">
                            <button 
                              onClick={() => handleRejectStaff(req.uid)}
                              className="bg-red-600/20 text-red-500 px-3 py-1.5 rounded-xl text-xs font-black"
                            >
                              Reddet
                            </button>
                            <button 
                              onClick={() => handleApproveStaff(req)}
                              className="bg-green-600 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-lg"
                            >
                              Onayla
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}

              </div>
            )}

          </main>

          {/* --- ALT NOTİFİKASYON BANNER --- */}
          <footer className="bg-slate-950 p-4 border-t border-slate-900 text-center text-[10px] text-slate-600 font-bold uppercase tracking-widest">
             AKMA KOLEKTİF • GAZİANTEP MERKEZ SIRALAR
          </footer>

          {/* --- ŞİFRE GİRİŞ MODAL (PATRON İÇİN) --- */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-black/95 backdrop-blur-md z-[120] flex items-center justify-center p-4">
              <form onSubmit={handlePasswordSubmit} className="bg-slate-900 border border-slate-800 p-8 rounded-[3rem] text-center max-w-xs w-full shadow-2xl space-y-6 animate-in zoom-in-95 duration-200">
                 <div className="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mx-auto border border-yellow-500/20">
                    <Icons.ShieldAlert className="text-yellow-500" size={32} />
                 </div>
                 <div className="space-y-1">
                    <h3 className="font-black text-lg text-white">Patron Girişi</h3>
                    <p className="text-xs text-slate-400">Yönetim kabinine erişmek için 4 haneli şifreyi gir kanka.</p>
                 </div>
                 <input 
                    type="password" 
                    required
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    placeholder="Şifre"
                    className="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl text-center text-xl font-mono text-white outline-none tracking-widest focus:border-yellow-500 transition-all"
                 />
                 <div className="flex gap-2">
                    <button type="button" onClick={() => { setShowPasswordModal(false); setRole('customer'); }} className="flex-1 py-3 bg-slate-800 rounded-xl text-xs font-bold text-slate-400">Vazgeç</button>
                    <button type="submit" className="flex-1 py-3 bg-yellow-500 text-slate-950 rounded-xl text-xs font-black">GİRİŞ YAP</button>
                 </div>
              </form>
            </div>
          )}

          {/* --- TOAST / SİPARİŞ TAMAM POPUP --- */}
          {showToast && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-[3rem] text-center max-w-xs w-full shadow-2xl">
                 <div className="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-500/20">
                    <Icons.Check className="text-green-400" size={32} />
                 </div>
                 <h3 className="font-black text-lg text-white">SİPARİŞ ALINDI!</h3>
                 <p className="text-xs text-slate-400 mt-2">Siparişin buluta başarıyla kaydedildi kanka! Örücü ve Kurye ekibimiz atandıktan sonra hazırlık başlayacak.</p>
              </div>
            </div>
          )}

        </div>
      );
    };

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
